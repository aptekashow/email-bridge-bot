name: Build RC release

on:
  push:
    tags:
      - "v*-rc*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate installer and Python sources
        run: |
          bash -n install.sh
          python -m compileall -q .
          python -m pip install --disable-pip-version-check -r requirements.txt
          DATABASE_URL=sqlite:////tmp/email-bridge-rc-check.db SECRET_KEY=rc-check ADMIN_PASSWORD=rc-check-password python - <<'PY'
          from datetime import datetime
          from app import create_app
          app = create_app({'TESTING': True})
          rendered = app.jinja_env.filters['moscow_datetime'](datetime(2026, 1, 1, 0, 0))
          assert rendered == '01.01.2026 03:00:00', rendered
          print('Flask app import and Moscow time conversion: OK')
          PY

      - name: Package release archive
        id: package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            VERSION="$(cat VERSION)"
          fi
          mkdir -p dist
          ARCHIVE="email-bridge-bot-${VERSION}.tar.gz"
          git archive --format=tar.gz --prefix="email-bridge-bot-${VERSION}/" HEAD > "dist/${ARCHIVE}"
          cd dist
          sha256sum "${ARCHIVE}" > SHA256SUMS
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: email-bridge-bot-${{ steps.package.outputs.version }}
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${{ steps.package.outputs.archive }}" \
            "dist/SHA256SUMS" \
            --title "Email Bridge Bot ${{ steps.package.outputs.version }} (RC)" \
            --prerelease \
            --notes "RC build for Ubuntu Server 24.04 LTS. Includes sender allowlist, Moscow-time display in history, web panel, IMAP worker, Telegram delivery via SOCKS5, MAX notifications and MAX incoming command worker. See README.md for installation."
