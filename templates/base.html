<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Email Bridge{% endblock %}</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d31;--line:#293650;--text:#edf2ff;--muted:#9eabc4;--accent:#6ea8fe;--good:#52c99a;--bad:#ff7777}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17233e 0,#0b1020 55%);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif;min-height:100vh}
.wrap{max-width:1050px;margin:auto;padding:28px 20px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{font-size:20px;font-weight:750;letter-spacing:.2px}.brand span{color:var(--accent)}nav{display:flex;gap:8px;flex-wrap:wrap}a{color:var(--accent);text-decoration:none}nav a,.btn{padding:9px 13px;border:1px solid var(--line);border-radius:10px;color:var(--text);background:#17223a}nav a:hover,.btn:hover{border-color:var(--accent)}.panel{background:rgba(21,29,49,.94);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 12px 35px #0002}h1{font-size:28px;margin:0 0 8px}h2{font-size:19px;margin:0 0 14px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.stat{padding:18px;border:1px solid var(--line);border-radius:13px;background:#111a2d}.num{font-size:30px;font-weight:750}.field{display:block;margin:14px 0}.field span{display:block;color:var(--muted);margin-bottom:6px}input,select{width:100%;max-width:560px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#0e1729;color:var(--text);font:inherit}input:focus,select:focus{outline:2px solid #6ea8fe55;border-color:var(--accent)}button,.button{cursor:pointer;border:0;border-radius:9px;background:var(--accent);color:#071225;font-weight:700;padding:10px 16px;font:inherit}button.secondary{background:#263550;color:var(--text);border:1px solid var(--line)}button.danger{background:#482a37;color:#ffdce3;border:1px solid #744052}.inline{display:inline}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600}.flash{padding:11px 14px;border-radius:10px;margin:10px 0;background:#1b3540}.flash.error{background:#492b37}.flash.success{background:#173b35}.tag{display:inline-block;padding:3px 8px;border-radius:20px;background:#263550;color:#dce8ff;font-size:12px}.tag.ok{background:#173b35;color:#a7f1d3}.tag.err{background:#492b37;color:#ffd3d3}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.small{font-size:13px}.logout{margin-left:auto}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.wrap{padding:18px 12px}.panel{padding:16px}h1{font-size:24px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">✉ <span>Email</span> Bridge</div>{% if session.get('authenticated') %}<nav><a href="{{ url_for('index') }}">Обзор</a><a href="{{ url_for('settings') }}">Настройки</a><a href="{{ url_for('rules') }}">Правила</a><a href="{{ url_for("contacts") }}">Контакты</a><a href="{{ url_for('history') }}">История</a></nav><form class="logout" method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="secondary" type="submit">Выйти</button></form>{% endif %}</header>
{% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</div></body></html>
