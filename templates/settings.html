{% extends 'base.html' %}{% block content %}<h1>Настройки</h1><p class="muted">Секреты не отображаются в форме. Оставьте поле пустым, чтобы сохранить прежнее значение.</p><section class="panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>Почтовый сервер</h2><label class="field"><span>IMAP сервер</span><input name="imap_server" value="{{ s.imap_server }}" required></label><label class="field"><span>Порт</span><input name="imap_port" type="number" min="1" max="65535" value="{{ s.imap_port }}" required></label><label class="field"><span>Адрес электронной почты</span><input name="email_user" type="email" value="{{ s.email_user }}"></label><label class="field"><span>Пароль / пароль приложения</span><input name="email_pass" type="password" autocomplete="new-password" placeholder="Не изменять"></label><hr style="border-color:var(--line);margin:24px 0"><h2>Мессенджеры</h2><label class="field"><span>Токен Telegram Bot</span><input name="tg_token" type="password" autocomplete="new-password" placeholder="Не изменять"></label><label class="field"><span>Токен MAX Bot</span><input name="max_token" type="password" autocomplete="new-password" placeholder="Не изменять"></label><hr style="border-color:var(--line);margin:24px 0"><label class="field"><span>Интервал проверки (15–3600 секунд)</span><input name="check_interval" type="number" min="15" max="3600" value="{{ s.check_interval }}" required></label><button type="submit">Сохранить настройки</button></form></section>{% endblock %}
